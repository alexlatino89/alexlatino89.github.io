<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexander Latino</title>
<meta name="description" content="Alexander Latino — marca personal y Viral Studio, herramientas con IA para creadores y marcas.">
<style>
  :root { --bg:#0b0912; --text:#f4f1fb; --muted:#a8a1bd; --card:#15111f; --line:#2a2340; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background: radial-gradient(900px 500px at 20% 0%, #3b1f6b55, transparent), radial-gradient(700px 500px at 100% 100%, #ff4d8d33, transparent), var(--bg);
         color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; width:100%; text-align:center; }
  h1 { font-size:2.4rem; margin:0 0 8px; background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); line-height:1.6; }
  .tools { display:grid; gap:12px; margin:28px 0; }
  a.tool { display:block; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:var(--text); text-decoration:none; text-align:left; }
  a.tool:hover { border-color:#a78bfa; }
  a.tool strong { display:block; margin-bottom:2px; }
  a.tool span { color:var(--muted); font-size:.92rem; }
  small a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Alexander Latino</h1>
  <p>Mi web personal está en construcción. Mientras tanto, estas son las herramientas de <strong>Viral Studio</strong>:</p>
  <div class="tools">
    <a class="tool" href="/viral-score/"><strong>Viral Score</strong><span>Evalúa el potencial viral de tu contenido.</span></a>
    <a class="tool" href="/viral-influencer/"><strong>Viral Influencer</strong><span>Elige el influencer que mejor encaja con tu marca.</span></a>
  </div>
  <small><a href="https://www.linkedin.com/in/alexander-latino/" rel="noopener">LinkedIn</a></small>
</main>
</body>
</html>
